name: test

on:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --omit=peer
      - run: npm install --global --ignore-scripts --omit=peer @earendil-works/pi-coding-agent@1.4.0
      - run: npm test
